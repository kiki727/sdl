sdl: "1.0"
kind: flow

flow:
  id: greet_user
  version: "1.0.0"

  inputs:
    name: String

  steps:
    - id: build_greeting
      call: greeter::greet
      mapping:
        name: name
      output_map:
        greeting: result

  outputs:
    message: String

  output_mapping:
    message: greeting.message
